{{ define "main" }}
<div class="list-page">
    <h2>{{ .Title }}</h2>

    <div class="posts-list">
        {{ range .Pages }}
        <article class="post-preview">
            <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            {{ if .Description }}
            <p>{{ .Description }}</p>
            {{ else }}
            <p>{{ .Summary }}</p>
            {{ end }}
        </article>
        {{ end }}
    </div>
</div>
{{ end }}
